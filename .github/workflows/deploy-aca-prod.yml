name: ACA prod 배포

# master 는 dev 에서 검증을 마친 것만 들어온다. 그래서 master 머지가 곧
# prod 승격이다. 수동 실행은 이미지를 다시 밀어야 할 때 쓴다.
on:
  push:
    branches: [master]
  workflow_dispatch:

# prod 배포도 한 번에 하나만. 연달아 머지되면 앞의 것을 끊고 뒤의 것을 올린다.
concurrency:
  group: aca-deploy-prod
  cancel-in-progress: true

permissions:
  id-token: write # OIDC 토큰 발급. 이게 없으면 azure/login 이 실패한다
  contents: read

env:
  RESOURCE_GROUP: azure_test-a89a8649-741-rg001
  ACR_NAME: wtembed10835
  CONTAINER_APP: mcp-studio-prod
  IMAGE_REPO: mcp-studio

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # staging 워크플로와 같은 자격 증명을 쓴다. 연합 자격 증명의 subject 가
      # master 브랜치로 박혀 있고, 이 워크플로도 master 에서만 돌기 때문이다.
      - uses: azure/login@v2
        with:
          client-id: fa515508-3e9e-409d-a5dd-744c0196c345
          tenant-id: 28fad9d9-3a2c-4a2f-b76f-8da5d0da9756
          subscription-id: 3c7b1819-c657-41ca-a22e-b6dc6d34fd98

      # 이미지는 커밋 SHA 태그를 쓴다. staging 워크플로가 같은 SHA 로 이미
      # 빌드해 두었다면 ACR 캐시로 곧장 끝난다 — 같은 코드가 두 번 빌드되어
      # 서로 다른 이미지가 되는 일을 막는 것이 목적이다.
      - name: 이미지 빌드
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_REPO:${{ github.sha }}" \
            --image "$IMAGE_REPO:prod" \
            .

      - name: Container App 이미지 교체
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_REPO:${{ github.sha }}"

      # 새 리비전이 실제로 200 을 내는지 확인한다. prod 는 특히, 배포가
      # 초록으로 끝났는데 화면이 죽어 있는 상태가 가장 나쁘다.
      - name: 헬스체크
        run: |
          FQDN=$(az containerapp show --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "https://$FQDN"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$FQDN/health" || true)
            if [ "$code" = "200" ]; then
              echo "정상"
              exit 0
            fi
            echo "$i 회차: $code"
            sleep 10
          done
          echo "헬스체크 실패"
          exit 1
