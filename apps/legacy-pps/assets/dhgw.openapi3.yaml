openapi: 3.0.3
info:
  title: DHGW 조달데이터 연계 게이트웨이 (가상)
  version: 2.1.0
  description: 시연용 가상 시스템. 값은 모두 문자열이다.
servers:
- url: http://10.70.1.10:18002
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes: {}
security:
- oauth2: []
paths:
  /dhgw/ad/BidPublicInfoService/getBidPblancListInfoThng:
    get:
      operationId: getBidPblancListInfoThng
      summary: 물품 입찰공고 목록 조회
      parameters:
      - name: inqryDiv
        in: query
        required: true
        description: 조회구분 1:등록일시 2:입찰공고번호 3:변경일시
        schema:
          type: string
      - name: inqryBgnDt
        in: query
        required: false
        description: 조회시작일시 YYYYMMDDHHMM (구분 1·3 필수, 최대 1개월)
        schema:
          type: string
      - name: inqryEndDt
        in: query
        required: false
        description: 조회종료일시 YYYYMMDDHHMM
        schema:
          type: string
      - name: bidNtceNo
        in: query
        required: false
        description: 입찰공고번호 13자리 (구분 2 필수)
        schema:
          type: string
      - name: pageNo
        in: query
        required: true
        description: 페이지 번호
        schema:
          type: string
      - name: numOfRows
        in: query
        required: true
        description: 한 페이지 결과 수
        schema:
          type: string
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: object
                    properties:
                      header:
                        type: object
                        properties:
                          resultCode:
                            type: string
                          resultMsg:
                            type: string
                      body:
                        type: object
                        properties:
                          totalCount:
                            type: integer
                          pageNo:
                            type: integer
                          numOfRows:
                            type: integer
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                bidNtceNo:
                                  type: string
                                  description: 입찰공고번호
                                bidNtceOrd:
                                  type: string
                                  description: 입찰공고차수
                                ntceKindNm:
                                  type: string
                                  description: 공고종류명
                                bidNtceDt:
                                  type: string
                                  description: 입찰공고일시 YYYYMMDDHHMM
                                bidNtceNm:
                                  type: string
                                  description: 입찰공고명
                                ntceInsttCd:
                                  type: string
                                  description: 공고기관코드
                                ntceInsttNm:
                                  type: string
                                  description: 공고기관명
                                dminsttCd:
                                  type: string
                                  description: 수요기관코드
                                dminsttNm:
                                  type: string
                                  description: 수요기관명
                                bidMethdNm:
                                  type: string
                                  description: 입찰방식명
                                cntrctCnclsMthdNm:
                                  type: string
                                  description: 계약체결방법명
                                bidBeginDt:
                                  type: string
                                  description: 입찰개시일시
                                bidClseDt:
                                  type: string
                                  description: 입찰마감일시
                                opengDt:
                                  type: string
                                  description: 개찰일시
